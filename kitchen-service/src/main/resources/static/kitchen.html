<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Order Up! - Kitchen</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* layout + visual */
        :root { --divider-width: 6px; --card-bg: #fff7e6; --card-border: #000; }
        body { font-family: "Segoe UI", Roboto, Arial, sans-serif; padding: 8px 24px; background: #fff; }
        header { text-align:center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: var(--divider-width) solid var(--card-border); }
        h1 { margin: 0; font-size: 34px; }

        /* layout container — position relative so we can draw a full-height vertical divider */
        .layout-wrap { position: relative; margin-top: 18px; }
        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items:start; }

        /* vertical divider: a single element spanning from the top of layout-wrap to bottom */
        .layout-wrap::before {
          content: "";
          position: absolute;
          left: 50%;
          top: 0;
          bottom: 0;
          width: var(--divider-width);
          background: var(--card-border);
          transform: translateX(-50%);
          z-index: 0;
        }

        .column { padding: 0 24px; z-index: 1; box-sizing: border-box; }
        .left { padding-right: 12px; }
        .right { padding-left: 12px; }

        .title { font-size: 22px; margin: 6px 0 12px; font-weight: 600; }
        .orders { display:flex; flex-direction:column; gap: 18px; min-height:120px; }

        .order-card {
          border: 6px solid var(--card-border);
          padding: 18px;
          background: var(--card-bg);
          position: relative;
          min-height: 90px;
          box-sizing: border-box;
        }
        .order-meta { font-size: 13px; color: #333; margin-bottom: 8px; }
        .items { margin: 8px 0; padding-left: 20px; }
        .items li { margin-bottom: 6px; }
        .comment { font-size: 13px; margin-top: 8px; color:#222; }
        .timestamp { position: absolute; top: 12px; right: 16px; font-size: 12px; opacity: 0.85; }
        .complete-btn {
          position: absolute;
          bottom: 12px;
          right: 16px;
          padding: 8px 12px;
          border: 1px solid #333;
          background: white;
          cursor: pointer;
        }
        .complete-btn[disabled] { opacity: .5; cursor: default; }
        .empty { color: #555; font-style: italic; padding: 10px; }

        @media (max-width: 900px) {
          .layout { grid-template-columns: 1fr; }
          .layout-wrap::before { display: none; } /* hide vertical divider on small screens */
        }
    </style>
</head>
<body>
<header>
    <h1>Order Up! - Kitchen</h1>
</header>

<div class="layout-wrap">
    <div class="layout">
        <section class="column left">
            <div class="title">Active Orders</div>
            <div id="activeOrders" class="orders">
                <div class="empty">Loading…</div>
            </div>
        </section>

        <section class="column right">
            <div class="title">Completed Orders</div>
            <div id="completedOrders" class="orders">
                <div class="empty">No completed orders</div>
            </div>
        </section>
    </div>
</div>

<script src="/js/kitchen.js"></script>
</body>
</html>
